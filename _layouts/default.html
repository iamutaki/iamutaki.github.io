<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% include seo.html %}
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="{{ site.title }}"
      href="{{ '/feed.xml' | absolute_url }}"
    />
    <link
      rel="preload"
      href="/fonts/BerkeleyMono-Regular-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      {% include style.css %}
    </style>
    <!-- Cloudflare Web Analytics -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "0a6eb8cebbec4055832e09809ca67556"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </head>
  <body>
    <main>
      {% include boot.html %}
      {{ content }}
    </main>
    <footer class="statusline" aria-hidden="true">
      <span class="mode">-- NORMAL --</span>
      <span class="fname">~/{{ page.path | default: 'index.html' }}</span>
      <span class="ruler">[utf-8] <span id="pct">Top</span></span>
    </footer>
    <script>
      (() => {
        const el = document.getElementById("pct");
        const upd = () => {
          const h = document.documentElement;
          const max = h.scrollHeight - h.clientHeight;
          let label;
          if (max <= 0) {
            label = "All"; // seluruh buffer muat di layar, sama seperti ruler vim
          } else {
            const p = Math.round((h.scrollTop / max) * 100);
            label = p <= 0 ? "Top" : p >= 100 ? "Bot" : p + "%";
          }
          el.textContent = label;
        };
        addEventListener("scroll", upd, { passive: true });
        upd();
      })();
    </script>
  </body>
</html>
