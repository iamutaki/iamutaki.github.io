<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.seo_title | default: page.title | default: site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <link
      rel="canonical"
      href="{{ page.url | replace: 'index.html', '' | absolute_url }}"
    />
    <meta property="og:type" content="{{ page.og_type | default: 'website' }}" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:title" content="{{ page.seo_title | default: page.title | default: site.title }}" />
    <meta
      property="og:description"
      content="{{ page.description | default: site.description }}"
    />
    <meta
      property="og:url"
      content="{{ page.url | replace: 'index.html', '' | absolute_url }}"
    />
    <meta property="og:image" content="{{ '/og.png' | absolute_url }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ibnul Mutaki",
        "jobTitle": "Fall Stuck Developer",
        "url": "https://www.iamutaki.com",
        "email": "mailto:ibnuul@gmail.com",
        "sameAs": ["https://www.facebook.com/ibnulmutaki/"]
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/BerkeleyMono-Regular-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      {% include_relative ../css/style.css %}
    </style>
    <!-- Cloudflare Web Analytics -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "0a6eb8cebbec4055832e09809ca67556"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </head>
  <body>
    {{ content }}
  </body>
</html>
