<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.seo_title | default: page.title | default: site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <link
      rel="canonical"
      href="{{ page.url | replace: 'index.html', '' | absolute_url }}"
    />
    <meta property="og:type" content="{{ page.og_type | default: 'website' }}" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:title" content="{{ page.seo_title | default: page.title | default: site.title }}" />
    <meta
      property="og:description"
      content="{{ page.description | default: site.description }}"
    />
    <meta
      property="og:url"
      content="{{ page.url | replace: 'index.html', '' | absolute_url }}"
    />
    <meta property="og:image" content="{{ '/og.png' | absolute_url }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ibnul Mutaki",
        "jobTitle": "Fall Stuck Developer",
        "url": "https://www.iamutaki.com",
        "email": "mailto:ibnuul@gmail.com",
        "sameAs": ["https://www.facebook.com/ibnulmutaki/"]
      }
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="{{ site.title }}"
      href="{{ '/feed.xml' | absolute_url }}"
    />
    <link
      rel="preload"
      href="/fonts/BerkeleyMono-Regular-subset.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      {% include style.css %}
    </style>
    <!-- Cloudflare Web Analytics -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "0a6eb8cebbec4055832e09809ca67556"}'
    ></script>
    <!-- End Cloudflare Web Analytics -->
  </head>
  <body>
    <main>{{ content }}</main>
    <footer class="statusline" aria-hidden="true">
      <span class="mode">-- NORMAL --</span>
      <span class="fname">~/{{ page.path | default: 'index.html' }}</span>
      <span class="ruler">[utf-8] <span id="pct">Top</span></span>
    </footer>
    <script>
      (() => {
        const el = document.getElementById("pct");
        const upd = () => {
          const h = document.documentElement;
          const max = h.scrollHeight - h.clientHeight;
          let label;
          if (max <= 0) {
            label = "All"; // seluruh buffer muat di layar, sama seperti ruler vim
          } else {
            const p = Math.round((h.scrollTop / max) * 100);
            label = p <= 0 ? "Top" : p >= 100 ? "Bot" : p + "%";
          }
          el.textContent = label;
        };
        addEventListener("scroll", upd, { passive: true });
        upd();
      })();
    </script>
  </body>
</html>
