<div class="boot" aria-hidden="true">
  <div class="boot-line">
    <span class="boot-ts" data-boot-offset="0">00:00:00</span>
    <span class="boot-msg">iamutaki init<span class="boot-dots">. . . . . . . . . . . . . . . . . . . .</span></span>
    <span class="boot-st"></span>
  </div>
</div>
<script>
  (() => {
    const pad = (n) => String(n).padStart(2, "0");
    const el = document.querySelector(".boot-ts");
    if (!el) return;
    const d = new Date();
    el.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  })();
</script>
